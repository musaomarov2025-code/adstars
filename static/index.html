<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Control Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ЗАГРУЗКА -->
<div id="loader">Загрузка...</div>

<!-- ГЛАВНАЯ -->
<div id="app" style="display:none">

  <!-- ШАПКА -->
  <header>
    <div id="acc-info">Проверка аккаунта...</div>
    <div id="counter">Отправлено сегодня: 0 / 300</div>
  </header>

  <!-- ЭКРАН: ГЛАВНАЯ -->
  <section id="screen-home" class="screen active">
    <button class="menu-btn" onclick="go('screen-bc')">📤 Рассылка</button>
    <button class="menu-btn" onclick="go('screen-aj')">🔗 Автоподписка</button>
    <button class="menu-btn" onclick="go('screen-tr')">💬 Автотриггер</button>
    <button class="menu-btn" onclick="go('screen-acc')">👤 Аккаунт</button>
    <button class="menu-btn" onclick="go('screen-logs')">📊 Логи</button>
  </section>

  <!-- ЭКРАН: АККАУНТ -->
  <section id="screen-acc" class="screen">
    <button class="back" onclick="go('screen-home')">← Назад</button>
    <h3>Аккаунт</h3>
    <div id="acc-status">Проверка...</div>
    <div id="acc-login" style="display:none">
      <input id="phone" placeholder="+7..." type="tel">
      <button onclick="loginPhone()">Отправить код</button>
      <input id="code" placeholder="Код из Telegram" style="display:none">
      <button onclick="loginCode()" id="codeBtn" style="display:none">Войти</button>
      <input id="pass2fa" placeholder="Пароль 2FA" style="display:none">
      <button onclick="login2FA()" id="pass2faBtn" style="display:none">Подтвердить</button>
    </div>
  </section>

  <!-- ЭКРАН: РАССЫЛКА -->
  <section id="screen-bc" class="screen">
    <button class="back" onclick="go('screen-home')">← Назад</button>
    <h3>Рассылка</h3>

    <label>Цели (чаты/@username, через запятую):</label>
    <textarea id="bc-targets" placeholder="@chat1, @chat2, -100123456"></textarea>
    <button onclick="bcAddTargets()">Добавить цели</button>
    <div id="bc-targets-list" class="list"></div>

    <label>Тексты (каждый — отдельно):</label>
    <textarea id="bc-text" placeholder="Текст сообщения"></textarea>
    <button onclick="bcAddText()">Добавить текст</button>
    <div id="bc-texts-list" class="list"></div>

    <label>Задержка (сек):</label>
    <div class="row">
      <input id="bc-dmin" type="number" placeholder="30">
      <input id="bc-dmax" type="number" placeholder="90">
    </div>

    <label>КД после круга (сек):</label>
    <input id="bc-cooldown" type="number" placeholder="60">

    <label>Повторов:</label>
    <input id="bc-repeats" type="number" placeholder="1">

    <label>Лимит в день:</label>
    <input id="bc-limit" type="number" placeholder="300">

    <button onclick="bcSaveSettings()">Сохранить настройки</button>
    <div class="row">
      <button class="green" onclick="bcStart()">▶ Старт</button>
      <button class="red" onclick="bcStop()">⏸=" Стоп</button>
    </div>
    <div id="bc-status"></div>
  </section>

  <!-- ЭКРАН: АВТОПОДПИСКА -->
  <section id="screen-aj" class="screen">
    <button class="back" onclick="go('screen-home')">← Назад</button>
    <h3>Автоподписка</h3>
    <div id="aj-toggle-box">
      <button onclick="ajToggle()" id="aj-toggle-btn">ВКЛ/ВЫКЛ</button>
    </div>

    <label>Боты-админы (@username):</label>
    <input id="aj-admin" placeholder="@bot_username">
    <button onclick="ajAddAdmin()">Добавить</button>
    <div id="aj-admins-list" class="list"></div>

    <label>Лимит в день:</label>
    <input id="aj-limit" type="number" placeholder5">

    <label>Задержка (сек):</label>
    <div class="row">
      <input id="aj-dmin" type="number" placeholder="30">
      <input id="aj-dmax" type="number" placeholder="90">
    </div>

    <button onclick="ajSave()">Сохранить</button>
  </section>

  <!-- ЭКРАН: АВТОТРИГГЕР -->
  <section id="screen-tr" class="screen">
    <button class="back" onclick="go('screen-home')">← Назад</button>
    <h3>Автотриггер</h3>
    <button onclick="trToggle()" id="tr-toggle-btn">ВКЛ/ВЫКЛ</button>

    <label>Триггерные слова:</label>
    <input id="tr-word" placeholder="пиши в лс">
    <button onclick="trAddWord()">Добавить слово</button>
    <div id="tr-words-list" class="list"></div>

    <label>Ответы (рандом):</label>
    <textarea id="tr-reply" placeholder="Ответ"></textarea>
    <button onclick="trAddReply()">Добавить ответ</button>
    <div id="tr-replies-list" class="list"></div>

    <label>
      <input type="checkbox" id="tr-add-contact" checked>
      Добавлять в контакты
    </label>

    <label>Задержка ответа (сек):</label>
    <div class="row">
      <input id="tr-dmin" type="number" placeholder="5">
      <input id="tr-dmax" type="number" placeholder="30">
    </div>

    <button onclick="trSave()">Сохранить</button>
  </section>

  <!-- ЭКРАН: ЛОГИ -->
  <section id="screen-logs" class="screen">
    <button class="back" onclick="go('screen-home')">← Назад</button>
    <h3>Логи</h3>
    <button onclick="loadLogs()">Обновить</button>
    <div id="logs-list" class="list"></div>
  </section>

</div>

<script src="/app.js"></script>
</body>
</html>
